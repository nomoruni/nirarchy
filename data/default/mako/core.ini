anchor=top-right
group-by=app-name,summary,body
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
max-icon-size=32
font=sans-serif 14px

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[urgency=critical]
default-timeout=0
layer=overlay

[summary~="Screenshot saved"]
max-icon-size=80
format=<b>%s</b>\n%b

[app-name=nirarchy-crash]
on-button-left=exec nirarchy-agent-crash
invisible=0
