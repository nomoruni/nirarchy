[main]
include=~/.config/nirarchy/current/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=11
pad=12x12
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Shift+Insert
